include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated code: never linted, never edited. Covered by the contract hash test instead.
    - packages/**
    - lib/core/l10n/generated/**
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
