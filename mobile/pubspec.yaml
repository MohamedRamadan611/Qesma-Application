name: qesma
description: "Qesma (قسمة): group expense splitting for Egypt. Records who paid what; never moves money."
publish_to: 'none'
version: 0.1.0+1

# Pinned exactly (ADR-006). Dependabot proposes bumps; a human reviews them.
environment:
  sdk: 3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  built_collection: 5.1.2
  built_value: 8.13.0
  dio: 5.11.1
  flutter_riverpod: 3.5.0
  go_router: 18.1.3
  intl: 0.20.3
  # GENERATED from ../docs/openapi.json by tool/generate_api.sh. Never edit by hand.
  qesma_api:
    path: packages/qesma_api
  google_sign_in: 7.2.0
  flutter_secure_storage: 11.2.0
  url_launcher: 6.3.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  crypto: 3.0.8
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/brand/google_g.png
  fonts:
    # IBM Plex Sans Arabic (SIL OFL 1.1), bundled: see assets/fonts/README.md.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
