# Weekly update pull requests for the backend's dependencies (ADR-003). Security advisories also open PRs.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  # The Flutter app and its generated client (ADR-006). Versions are pinned exactly; these PRs are how they move.
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
