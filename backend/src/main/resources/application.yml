spring:
  application:
    name: qesma-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  server-header: ""          # do not advertise the server product or version
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

qesma:
  auth:
    # Both are required in prod and have no default here. Secret: base64 of >= 32 random bytes.
    jwt-secret: ${QESMA_JWT_SECRET}
    google-client-ids: ${GOOGLE_CLIENT_IDS}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    rate-limit:
      max-requests: 10
      window: 1m
  idempotency:
    ttl: 24h              # spec 8.3: stored responses can be replayed for 24 hours
    cleanup-interval: PT1H
  activity:
    retention: 180d       # B15 (A103): events and their notifications older than this are purged
    purge-interval: PT6H

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true

# OpenAPI docs are off everywhere except the local profile.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_0     # the Dart generator supports 3.0 fully, 3.1 only experimentally
  swagger-ui:
    enabled: false
